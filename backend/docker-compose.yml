version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/guide?schema=public"
      JWT_SECRET: "docker_secret_key"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      - postgres
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/server.js"

volumes:
  postgres_data: